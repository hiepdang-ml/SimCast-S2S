cnn:

  in_features: 21
  out_features: 1
  embedding_dim: 1024
  n_hidden_layers: 12

  learning_rate: 1e-6
  train_batch_size: 4
  val_batch_size: 1

  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: null
  saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/train_era5/cnn_large/"
  # inference
  target_path: "/scratch/zgp2ps/s2s_results/train_era5/cnn_large/"


unet:

