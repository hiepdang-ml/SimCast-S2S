cnn:

  device: "cuda"
  in_features: 14
  out_features: 1
  embedding_dim: 1024
  n_hidden_layers: 8

  learning_rate: 1e-6
  train_batch_size: 4
  val_batch_size: 1
  
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: ".cnn_checkpoints/cnn22.pt"
  saved_checkpoint_directory: ".cnn_checkpoints"
  

unet:

  device: "cuda"
  in_features: 14
  out_features: 1
  embedding_dim: 256

  learning_rate: 1e-5
  train_batch_size: 4
  val_batch_size: 1
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: ".unet_checkpoints/unet12.pt"
  saved_checkpoint_directory: ".unet_checkpoints"
  

vit:

  device: "cuda"
  in_features: 14
  out_features: 1
  embedding_dim: 2048
  patch_size: 16
  n_heads: 8
  n_transformer_layers: 6
  dropout: 0.1

  learning_rate: 1e-5
  train_batch_size: 16
  val_batch_size: 1
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: null
  saved_checkpoint_directory: ".vit_checkpoints"


