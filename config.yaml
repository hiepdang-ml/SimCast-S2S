cnn:

  in_features: 21
  out_features: 1
  embedding_dim: 1024
  n_hidden_layers: 8

  learning_rate: 1e-6
  train_batch_size: 4
  val_batch_size: 1
  
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  # from_checkpoint: ".cnn_checkpoints/cnn22.pt"
  # saved_checkpoint_directory: ".cnn_checkpoints"

  from_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/cnn_v2/cnn3.pt"
  saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/cnn_v2/"


