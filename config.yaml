cesm2:

  raw_root: "/standard/mamalakislab_storage/shared/cesm2/data/"
  landmask_root: "/standard/mamalakislab_storage/shared/cesm2/landmask/"
  # fixed configs
  input_vars: [
    "U200", "V200", "U500", "V500", "OMEGA500", "U850", "V850",
    "Z200", "Z500", "Z850", "PSL",
    "TS", "T200", "T500", "T850", "FLUT",
    "TMQ", "Q200", "Q500", "Q850",
    "PRECT",
  ] # order matters
  output_vars: ["PRECT"]
  resolution: [192, 288]
  # NOTE: `sim_ids` can be selected individually for exportdata.py
  sim_ids: [
    # Configuration: BHISTsmbb
    "1011.001", "1031.002", "1051.003", "1071.004", "1091.005", "1111.006", "1131.007", "1151.008", "1171.009", "1191.010",
  ]
  # modifiable configs:
  train_start_year: 1950
  train_end_year: 2000
  val_start_year: 2001
  val_end_year: 2010
  test_start_year: 2011
  test_end_year: 2014

  n_input_days: 84
  n_lead_days: 14
  n_output_days: 28
  n_step_days: 14

  train_write_directory: "/scratch/zgp2ps/cesm2/tensors/train/"
  val_write_directory: "/scratch/zgp2ps/cesm2/tensors/val/"
  test_write_directory: "/scratch/zgp2ps/cesm2/tensors/test/"
  detrender_state_directory: "/scratch/zgp2ps/cesm2/tensors/detrender/"
  climatology_state_directory: "/scratch/zgp2ps/cesm2/tensors/climatology/"


era5:

  raw_root: "/standard/mamalakislab_storage/shared/era5/raw/"
  array_root: "/standard/mamalakislab_storage/shared/era5/arrays/"
  landmask_root: "/standard/mamalakislab_storage/shared/era5/raw/landmask/"
  # fixed configs
  input_vars: [
    "u200", "v200", "u500", "v500", "w500", "u850", "v850",
    "z200", "z500", "z850", "msl",
    "skt", "t200", "t500", "t850", "avgtnlwrf",
    "tcwv", "q200", "q500", "q850",
    "tp",
  ] # order matters
  output_vars: ["tp"]
  resolution: [192, 288]
  sim_ids: ["reanalysis"]
  # modifiable configs:
  train_start_year: 1940
  train_end_year: 2010
