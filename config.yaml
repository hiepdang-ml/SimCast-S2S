diffusion:

  device: "cuda"
  target_dim: 32  # fixed, vae-precipitation.latent_dim
  condition_dim: 2352 # fixed, (vae-wind.latent_dim + vae-geopotential.latent_dim + vae-thermaldynamic.latent_dim + vae-precipitation.latent_dim) * n_condition_days
  n_condition_days: 28  # fixed, dataset.n_input_days
  step_dim: 64
  day_dim: 64
  # Unet configurations
  down_hidden_dims: [2048, 512]
  down_out_dims: [256, 256]
  mid_hidden_dims: [512, 512]
  mid_out_dims: [256, 256]
  up_hidden_dims: [512, 512]
  up_out_dims: [256, 256]

  n_layers_per_scaling_block: 8
  n_layers_per_mid_block: 4
  n_attention_heads: 1
  switch_ratio: 0.3    # p(condition_switch=off)
  # Diffusion configurations
  noise_scheduler: "cosine" # "linear" | "cosine"
  n_steps: 1000
  beta_min: 0.001  # linear only
  beta_max: 0.015  # linear only
  # Sampling
  eta: 0.
  # Training
  learning_rate: 1e-5
  train_batch_size: 4
  val_batch_size: 4
  n_epochs: 1000
  patience: 20
  tolerance: 0.
  save_frequency: 1

  wind_vae_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_wind_16times/vae7.pt"
  geopotential_vae_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_geopotential_16times/vae41.pt"
  thermaldynamic_vae_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_thermaldynamic_16times/vae19.pt"
  precipitation_vae_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_precipitation_16times/vae16.pt"
  from_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/diffusion_v10/diffusion16.pt"
  saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/diffusion_v10"

