  saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/vae_precipitation_16times"


ddpm:

  device: "cuda"
  target_in_dim: 112  # fixed, must be vae-precipitation.latent_dim
  condition_in_dim: 1568  # fixed, vae-wind.latent_dim + vae-geopotential.latent_dim + vae-thermaldynamic.latent_dim + vae-previpitation.latent_dim
  step_in_dim: 32
  # Unet configurations
  down_out_dims: [128, 256]
  down_hidden_dims: [2048, 2048]
  mid_out_dims: [256, 256]
  mid_hidden_dims: [2048, 2048]
  up_out_dims: [128, 64]
  up_hidden_dims: [2048, 2048]
  n_layers_per_scaling_block: 2
  n_layers_per_mid_block: 2
  n_attention_heads: 8
  condition_dropout: 0.2
  # DDPM configurations
  n_steps: 1000
  noise_scheduler_scheme: "cosine" # "linear" or "cosine"
  beta_min: 1e-4  # only applicable for "linear" 
  beta_max: 0.02  # only applicable for "linear"

  # Training
  learning_rate: 1e-5
  train_batch_size: 16
  val_batch_size: 16
  n_epochs: 1000
  patience: 20
  tolerance: 0.
  save_frequency: 1

  wind_vae_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_wind_16times/vae1.pt"
  geopotential_vae_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_geopotential_16times/vae36.pt"
  thermaldynamic_vae_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_thermaldynamic_16times/vae74.pt"
  precipitation_vae_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_precipitation_16times/vae84.pt"
  from_checkpoint: null
  saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/ddpm"


