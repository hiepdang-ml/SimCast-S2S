dataset:

  device: "cuda"
  root: "/scratch/zgp2ps/cesm2/data"
  input_vars: [
    "FLUT", "TS", 
    "PSL", "OMEGA500", 
    "U200", "V200", "Z200", 
    "U850", "V850", "Z850", 
    "U500", "V500", "Z500", 
    "PRECT",
  ]
  output_vars: ["PRECT"]
  # allow segmented execution by sim_id to reduce memory usage
  sim_ids: [
    "1001.001", 
    "1021.002", 
    "1041.003", 
    "1061.004", 
    "1081.005", 
    "1101.006", 
    "1121.007", 
    "1141.008", 
    "1161.009", 
    "1181.010", 
  ]
  train_start_year: 1950
  train_end_year: 2000
  val_start_year: 2001
  val_end_year: 2010
  test_start_year: 2011
  test_end_year: 2014

  n_input_days: 28
  n_lead_days: 21
  n_output_days: 7
  n_step_days: 7
  climatological_window_size: 15

  train_write_directory: "/scratch/zgp2ps/cesm2/tensors/train"
  train_metadata_directory: "/scratch/zgp2ps/cesm2/tensors/train/metadata"
  val_write_directory: "/scratch/zgp2ps/cesm2/tensors/val"
  val_metadata_directory: "/scratch/zgp2ps/cesm2/tensors/val/metadata"
  test_write_directory: "/scratch/zgp2ps/cesm2/tensors/test"
  test_metadata_directory: "/scratch/zgp2ps/cesm2/tensors/test/metadata"

  detrender_state_directory: "/scratch/zgp2ps/cesm2/tensors/detrender"
  climatology_state_directory: "/scratch/zgp2ps/cesm2/tensors/climatology"


cnn:

  device: "cuda"
  in_features: 14
  out_features: 1
  embedding_dim: 1024
  n_hidden_layers: 8

  learning_rate: 1e-6
  train_batch_size: 4
  val_batch_size: 1
  
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: ".cnn_checkpoints/cnn22.pt"
  saved_checkpoint_directory: ".cnn_checkpoints"
  

unet:

  device: "cuda"
  in_features: 14
  out_features: 1
  embedding_dim: 256

  learning_rate: 1e-5
  train_batch_size: 4
  val_batch_size: 1
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: ".unet_checkpoints/unet3.pt"
  saved_checkpoint_directory: ".unet_checkpoints"
  

vit:

  device: "cuda"
  in_features: 14
  out_features: 1
  embedding_dim: 2048
  patch_size: 16
  n_heads: 8
  n_transformer_layers: 6
  dropout: 0.1

  learning_rate: 1e-5
  train_batch_size: 16
  val_batch_size: 1
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: null
  saved_checkpoint_directory: ".vit_checkpoints"


vae-context:

  device: "cuda"
  latent_dim: 1568
  hidden_dim: 1024
  n_scaling_blocks: 3
  n_convstack_layers: 6
  n_convhead_layers: 4

  lambda: 0.9999
  learning_rate: 1e-5
  train_batch_size: 16
  val_batch_size: 16
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: ".vaecontext_16times_deep_checkpoints/vae24.pt"
  saved_checkpoint_directory: ".vaecontext_16times_deep_checkpoints"


vae-target:

  device: "cuda"
  latent_dim: 1
  hidden_dim: 128
  n_scaling_blocks: 3
  n_convstack_layers: 6
  n_convhead_layers: 4

  lambda: 0.9999
  learning_rate: 1e-5
  train_batch_size: 32
  val_batch_size: 4
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: ".vaetarget_64times_large_checkpoints/vae38.pt"
  saved_checkpoint_directory: ".vaetarget_64times_large_checkpoints"


ddpm:

  device: "cuda"
  target_in_dim: 4  # fixed by VAE being used
  condition_in_dim: 1568  # fixed by VAE being used
  step_in_dim: 32
  # Unet configurations
  down_out_dims: [128, 256]
  down_hidden_dims: [1024, 1024]
  mid_out_dims: [256, 256]
  mid_hidden_dims: [1024, 1024]
  up_out_dims: [128, 64]
  up_hidden_dims: [1024, 1024]
  n_layers_per_scaling_block: 4
  n_layers_per_mid_block: 2
  n_attention_heads: 8
  condition_dropout: 0.
  # DDPM configurations
  n_steps: 1000
  noise_scheduler_scheme: "cosine" # "linear" or "cosine"
  beta_min: 1e-4  # only applicable for "linear" 
  beta_max: 0.02  # only applicable for "linear"

  # Training
  learning_rate: 1e-5
  train_batch_size: 32
  val_batch_size: 8
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  target_vae_checkpoint: ".vaetarget_16times_large_checkpoints/vae73.pt"
  context_vae_checkpoint: ".vaecontext_16times_deep_checkpoints/vae27.pt"
  from_checkpoint: ".ddpm_checkpoints/unetdenoiser7.pt"
  saved_checkpoint_directory: ".ddpm_checkpoints"


