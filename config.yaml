cesm2:

  raw_root: "/scratch/zgp2ps/cesm2/data/"
  landmask_root: "/scratch/zgp2ps/cesm2/landmask/"
  # fixed configs
  input_vars: [
    "U200", "V200", "U500", "V500", "OMEGA500", "U850", "V850",
    "Z200", "Z500", "Z850", "PSL",
    "TS", "T200", "T500", "T850", "FLUT",
    "TMQ", "Q200", "Q500", "Q850",
    "PRECT",
  ] # order matters
  output_vars: ["PRECT"]
  resolution: [192, 288]
  # NOTE: `sim_ids` can be selected individually for exportdata.py
  sim_ids: [
    # Boundary condition: BHISTsmbb
    "1011.001",
    "1031.002",
    "1051.003",
    "1071.004",
    "1091.005",
    "1111.006",
    "1131.007",
    "1151.008",
    "1171.009",
    "1191.010",
    "1231.011",
    "1251.011",
    "1281.011",
    "1301.011",
    # # Boundary condition: BHISTcmip6
    # "1001.001",
    # "1021.002",
    # "1041.003",
    # "1061.004",
    # "1081.005",
    # "1101.006",
    # "1121.007",
    # "1141.008",
    # "1161.009",
    # "1181.010",
    # "1231.001",
    # "1251.001",
    # "1281.001",
    # "1301.001",
  ]
  # modifiable configs:
  train_start_year: 1950
  train_end_year: 2000
  val_start_year: 2001
  val_end_year: 2010
  test_start_year: 2011
  test_end_year: 2014

  n_input_days: 28
  n_lead_days: 14
  n_output_days: 14
  n_step_days: 14
  climatological_window_size: 15

  train_write_directory: "/scratch/zgp2ps/cesm2/tensors/train/"
  val_write_directory: "/scratch/zgp2ps/cesm2/tensors/val/"
  test_write_directory: "/scratch/zgp2ps/cesm2/tensors/test/"
  detrender_state_directory: "/scratch/zgp2ps/cesm2/tensors/detrender/"
  climatology_state_directory: "/scratch/zgp2ps/cesm2/tensors/climatology/"


era5:

