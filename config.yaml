diffusion:

  target_dim: 16  # fixed, vae-precip.latent_dim
  wind_condition_dim: 784 # # fixed, vae-wind.latent_dim * n_condition_days
  mass_condition_dim: 448 # # fixed, vae-mass.latent_dim * n_condition_days
  thermal_condition_dim: 560 # # fixed, vae-thermal.latent_dim * n_condition_days
  hydro_condition_dim: 448 # # fixed, vae-hydro.latent_dim * n_condition_days
  precip_condition_dim: 448 # # fixed, vae-precip.latent_dim * n_condition_days
  n_condition_days: 28  # fixed, dataset.n_input_days
  step_dim: 256
  day_dim: 256
  # Unet configurations
  down_hidden_dims: [1024, 1024]
  down_out_dims: [512, 512]
  mid_hidden_dims: [1024, 1024]
  mid_out_dims: [512, 512]
  up_hidden_dims: [1024, 1024]
  up_out_dims: [512, 512]

  n_conv_layers_per_scaling_block: 6
  n_attention_layers_per_scaling_block: 6
  n_conv_layers_per_mid_block: 2
  n_attention_layers_per_mid_block: 4
  n_attention_heads: 8
  switch_ratio: 0.    # p(condition_switch=off)
  # Diffusion configurations
  noise_scheduler: "cosine" # "linear" | "cosine"
  n_steps: 1000
  beta_min: 0.001  # linear only
  beta_max: 0.020  # linear only
  # Sampling
  eta: 0.
  # Training
  learning_rate: 1e-6
  train_batch_size: 4
  val_batch_size: 4
  n_epochs: 1000
  patience: 20
  tolerance: 0.
  save_frequency: 1

  vae_wind_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_wind_16times/vaewind25.pt"
  vae_mass_checkpoint:  "/scratch/zgp2ps/s2s_checkpoints/vae_mass_16times/vaemass26.pt"
  vae_thermal_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_thermal_16times/vaethermal25.pt"
  vae_hydro_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_hydro_16times/vaehydro26.pt"
  vae_precip_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_precip_4times/vaeprecip34.pt"
  vae_target_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_target_4times/vaetarget334.pt"

  from_checkpoint: null
  saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/diffusion_v16_cosine/"

