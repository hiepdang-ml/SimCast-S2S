diffusion:

  target_dim: 16  # fixed, vae-precip.latent_dim
  condition_dim: 96  # fixed, vae-wind.latent_dim + vae-mass.latent_dim + vae-thermal.latent_dim + vae-hydro.latent_dim + vae-precip.latent_dim
  # Denoiser configurations
  down_out_dims: [128, 256]
  mid_out_dims: [256, 256]
  up_out_dims: [256, 128]   # effective dim before transformer: up_out_dims[-1]
  down_transformer_model_dims: [128, 128]
  mid_transformer_model_dims: [128, 128]
  up_transformer_model_dims: [128, 128]
  n_conv_layers_per_scaling_block: 6
  n_transformer_encoder_layers_per_scaling_block: [1, 2]
  n_transformer_decoder_layers_per_scaling_block: [1, 2]
  n_conv_layers_per_mid_block: 3
  n_transformer_encoder_layers_per_mid_block: [4, 4]
  n_transformer_decoder_layers_per_mid_block: [4, 4]
  transformer_feedforward_dim: 2048
  n_attention_heads: 4
  transformer_maxlength: 84   # must be >= max(dataset.n_input_days, dataset.n_output_days)
  # Scheduler configs
  train_steps: 1000
  cosine_offset: 0.008  # standard, should not change
  # Sampling
  eta: 0.
  inference_steps: 200
  ensemble_size: 100
  guidance_scale: 1.
  # Training
  condition_dropout_prob: 0.2
  learning_rate: 1e-5
  train_batch_size: 8
  val_batch_size: 8
  n_epochs: 1000
  patience: 50
  tolerance: 0.
  save_frequency: 1

#   # Trained on CESM2
#   vae_wind_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_cesm2/vae_wind_16times/vaewind10.pt"
