  lambda: 0.999
  learning_rate: 1e-6
  train_batch_size: 32
  val_batch_size: 32
  n_epochs: 1000
  patience: 10
  tolerance: 0.
  save_frequency: 1

  from_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/vae_wind_16times/vae7.pt"
  saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/vae_wind_16times"


