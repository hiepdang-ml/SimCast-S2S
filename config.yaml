diffusion:

  target_dim: 16  # fixed, vae-precip.latent_dim
  condition_dim: 96  # fixed, vae-wind.latent_dim + vae-mass.latent_dim + vae-thermal.latent_dim + vae-hydro.latent_dim + vae-precip.latent_dim
  # Denoiser configurations
  down_out_dims: [256, 512]
  mid_out_dims: [512, 512]
  up_out_dims: [512, 256]   # effective dim before transformer: up_out_dims[-1]
  down_transformer_model_dims: [256, 256]
  mid_transformer_model_dims: [256, 256]
  up_transformer_model_dims: [256, 256]
  n_conv_layers_per_scaling_block: 6
  n_transformer_encoder_layers_per_scaling_block: 6
  n_transformer_decoder_layers_per_scaling_block: 6
  n_conv_layers_per_mid_block: 3
  n_transformer_encoder_layers_per_mid_block: 6
  n_transformer_decoder_layers_per_mid_block: 6
  transformer_feedforward_dim: 2048
  n_attention_heads: 4
  transformer_maxlength: 28   # must be >= max(dataset.n_input_days, dataset.n_output_days)
  # Diffusion configurations
  noise_scheduler: "cosine" # "linear" | "cosine"
  n_steps: 1000
  beta_min: 0.001  # linear only
  beta_max: 0.020  # linear only
  # Sampling
  eta: 0.
  ensemble_size: 20
  # Training
  learning_rate: 1e-6
  train_batch_size: 4
  val_batch_size: 4
  n_epochs: 1000
  patience: 20
  tolerance: 0.
  save_frequency: 1

  # vae_wind_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_cesm2/vae_wind_16times/vaewind6.pt"
  # vae_mass_checkpoint:  "/scratch/zgp2ps/s2s_checkpoints/train_cesm2/vae_mass_16times/vaemass11.pt"
  # vae_thermal_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_cesm2/vae_thermal_16times/vaethermal15.pt"
  # vae_hydro_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_cesm2/vae_hydro_16times/vaehydro3.pt"
  # vae_precip_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_cesm2/vae_precip_4times/vaeprecip6.pt"

  # from_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_cesm2/diffusion_v23_cosine/diffusion24.pt"
  # saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/train_cesm2/diffusion_v23_cosine/"
  # target_path: "/scratch/zgp2ps/s2s_results/train_cesm2/diffusion_eta020/"

  vae_wind_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_era5/vae_wind_16times/vaewind34.pt"
  vae_mass_checkpoint:  "/scratch/zgp2ps/s2s_checkpoints/train_era5/vae_mass_16times/vaemass228.pt"
  vae_thermal_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_era5/vae_thermal_16times/vaethermal196.pt"
  vae_hydro_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_era5/vae_hydro_16times/vaehydro48.pt"
  vae_precip_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_era5/vae_precip_4times/vaeprecip41.pt"

  from_checkpoint: "/scratch/zgp2ps/s2s_checkpoints/train_era5/diffusion_v23_cosine/diffusion36.pt"
  saved_checkpoint_directory: "/scratch/zgp2ps/s2s_checkpoints/train_era5/diffusion_v23_cosine/"
  target_path: "/scratch/zgp2ps/s2s_results/train_era5/diffusion_eta000/"
